<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECG / Utility Manager - Kratis</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>body{background:#0a0a0f;color:#fff;font-family:Arial;margin:0;padding:15px} .card{background:#16161f;padding:15px;border-radius:12px;border:1px solid #222;margin:10px 0} button{background:#FFD700;border:none;padding:8px 12px;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px} .red{background:#c00;color:#fff} .green{background:#0a0;color:#fff} select,input,textarea{width:100%;padding:9px;margin:5px 0;border-radius:8px;background:#222;color:#fff;border:1px solid #444} table{width:100%;font-size:12px;border-collapse:collapse} td,th{border:1px solid #333;padding:7px;vertical-align:top} .tab{background:#222;color:#fff;padding:10px;border-radius:8px} .tab.active{background:#FFD700;color:#000}</style>
</head><body>
<h2>⚡ ECG / Utility Manager</h2>
<p id="who" style="color:#FFD700"></p>
<button onclick="contactCEO()">💬 Contact CEO</button>
<button onclick="contactComplaint()">🚨 Contact Complaint Manager</button>
<button onclick="logout()" style="background:#c00;color:#fff">Logout</button>
<hr>
<button class="tab active" id="t-ecg" onclick="showTab('ecg')">⚡ ECG Prepaid (Manual)</button>
<button class="tab" id="t-util" onclick="showTab('util')">💧 Utility Payments (Reloadly)</button>

<div id="sec-ecg" class="card">
<h3>ECG Prepaid Orders</h3>
<select onchange="renderECG(this.value)"><option value="ALL">All</option><option value="USER">Users Only</option><option value="AGENT">Agents Only</option><option value="DEALER">Dealers Only</option></select>
<div id="ecgList"></div>
</div>

<div id="sec-util" class="card" style="display:none">
<h3>Utility Payments Orders</h3>
<select onchange="renderUtil(this.value)"><option value="ALL">All</option><option value="USER">Users Only</option><option value="AGENT">Agents Only</option><option value="DEALER">Dealers Only</option></select>
<div id="utilList"></div>
</div>

<script>
if(localStorage.getItem('manager_role')!=='ecg_manager'){ alert('Access Denied - ECG Manager Only'); location.href='admin-login.html'; }
document.getElementById('who').innerText='Logged in: '+localStorage.getItem('manager_name')+' ('+localStorage.getItem('manager_email')+')';

function O(){return JSON.parse(localStorage.getItem('kratis_orders')||'[]')}
function saveO(all){ localStorage.setItem('kratis_orders',JSON.stringify(all)); }
function showTab(t){
  document.getElementById('sec-ecg').style.display=t==='ecg'?'block':'none';
  document.getElementById('sec-util').style.display=t==='util'?'block':'none';
  document.getElementById('t-ecg').className='tab '+(t==='ecg'?'active':'');
  document.getElementById('t-util').className='tab '+(t==='util'?'active':'');
}
function isECG(o){ let s=((o.cat||'')+' '+(o.name||'')+' '+(o.hist||'')).toUpperCase(); return s.includes('ECG'); }
function isUtil(o){ let s=((o.cat||'')+' '+(o.name||'')+' '+(o.hist||'')).toUpperCase(); return s.includes('UTILITY'); }

function renderECG(filter){
  let orders=O().filter(isECG);
  if(filter!=='ALL') orders=orders.filter(o=>(o.tier||o.role||'USER')===filter);
  if(!orders.length){ document.getElementById('ecgList').innerHTML='<p style="color:#777">No ECG orders</p>'; return; }
  let html='<table><tr><th>Order ID</th><th>KDP</th><th>Name/Email/Date</th><th>Meter No</th><th>Amount</th><th>Status</th><th>Submit Token + Receipt</th></tr>';
  orders.forEach(o=>{
    html+=`<tr>
    <td><b>${o.id}</b></td>
    <td>${o.kdp||''}</td>
    <td>${o.name||''}<br>${o.email||''}<br><small>${new Date(o.date||Date.now()).toLocaleString()}</small></td>
    <td><b>${o.meter||o.recipient||o.phone||''}</b></td>
    <td>GH₵${o.amount||o.price||''}</td>
    <td>${o.status||'Pending'}</td>
    <td>
      <input id="token-${o.id}" placeholder="Type Token e.g. 1234-5678-9012">
      <input id="img-${o.id}" placeholder="Receipt Image URL (optional)">
      <button class="green" onclick="submitToken('${o.id}')">✅ Submit Token</button>
      <button onclick="checkReceipt('${o.id}')">🧾 Check Receipt</button>
    </td></tr>`;
  });
  document.getElementById('ecgList').innerHTML=html+'</table>';
}

function renderUtil(filter){
  let orders=O().filter(isUtil);
  if(filter!=='ALL') orders=orders.filter(o=>(o.tier||o.role||'USER')===filter);
  if(!orders.length){ document.getElementById('utilList').innerHTML='<p style="color:#777">No Utility orders</p>'; return; }
  let html='<table><tr><th>Order ID</th><th>KDP</th><th>Name/Email/Date</th><th>Provider/Meter</th><th>Amount</th><th>Status</th><th>Action</th></tr>';
  orders.forEach(o=>{
    html+=`<tr>
    <td><b>${o.id}</b></td>
    <td>${o.kdp||''}</td>
    <td>${o.name||''}<br>${o.email||''}<br><small>${new Date(o.date||Date.now()).toLocaleString()}</small></td>
    <td>${o.provider||o.name||''}<br><b>${o.meter||o.recipient||''}</b></td>
    <td>GH₵${o.amount||o.price||''}</td>
    <td>${o.status||'Pending'}</td>
    <td>
      <button class="green" onclick="utilDone('${o.id}')">✅ Mark Delivered</button><br>
      <button class="red" onclick="utilFail('${o.id}')">❌ API Fail - Buy Manual Reloadly</button>
    </td></tr>`;
  });
  document.getElementById('utilList').innerHTML=html+'</table>';
}

function submitToken(id){
  let token=document.getElementById('token-'+id).value.trim();
  let img=document.getElementById('img-'+id).value.trim();
  if(!token){ alert('Type token first'); return; }
  let all=O(); let o=all.find(x=>x.id===id);
  o.status='Delivered'; o.token=token; o.receipt=img; o.delivered='Token: '+token;
  saveO(all);
  try{ db.collection('kratis_orders').doc(id).set(o,{merge:true}); }catch(e){}
  // Save to history for user to see when e click ECG
  let hist=JSON.parse(localStorage.getItem('kratis_history_'+o.email)||'[]');
  hist.push({msg:'⚡ ECG Token Delivered: '+token, orderId:id, date:new Date().toISOString(), receipt:img});
  localStorage.setItem('kratis_history_'+o.email, JSON.stringify(hist));
  alert('✅ Token sent to user: '+id);
  renderECG('ALL');
}
function checkReceipt(id){
  let o=O().find(x=>x.id===id);
  if(o.receipt){ window.open(o.receipt,'_blank'); } else { alert('No receipt image for '+id+'. Token: '+(o.token||'none')); }
}
function utilDone(id){ let all=O(); let o=all.find(x=>x.id===id); o.status='Delivered'; saveO(all); try{db.collection('kratis_orders').doc(id).set(o,{merge:true})}catch(e){} alert('Delivered'); renderUtil('ALL'); }
function utilFail(id){ let all=O(); let o=all.find(x=>x.id===id); o.status='Manual - Reloadly'; saveO(all); alert('Marked for manual Reloadly purchase: '+id); renderUtil('ALL'); }

function contactCEO(){ localStorage.setItem('kratis_mgr_msg','ECG Manager ('+localStorage.getItem('manager_email')+'): '+ (prompt('Message for CEO:')||'')); alert('Saved for CEO'); }
function contactComplaint(){ let m=prompt('Message for Complaint Manager:'); if(m){ localStorage.setItem('kratis_to_complaint',m); alert('Sent'); } }
function logout(){ localStorage.removeItem('manager_email'); localStorage.removeItem('manager_role'); location.href='admin-login.html'; }

renderECG('ALL'); renderUtil('ALL');
</script></body></html>
