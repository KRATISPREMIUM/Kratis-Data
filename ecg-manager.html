<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ECG Manager - KratisData</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Inter}body{background:#080808;color:#fff}#loginOverlay{position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#000,#1a1700);display:flex;align-items:center;justify-content:center;padding:20px}.box{background:#121212;border:1px solid #222;border-radius:22px;padding:32px;width:100%;max-width:400px}.field input{width:100%;background:#09090b;border:1px solid #27272a;border-radius:11px;padding:13px;color:#fff;outline:none;margin-top:12px}.btn{width:100%;margin-top:18px;background:linear-gradient(90deg,#FFD700,#FFC700);color:#000;border:none;border-radius:11px;padding:14px;font-weight:900;cursor:pointer}#dash{display:none;padding:20px}.card{background:#121212;border:1px solid #222;border-radius:14px;padding:18px;margin-top:14px}</style></head><body>
<div id="loginOverlay"><div class="box"><div style="display:flex;gap:10px;align-items:center"><img src="logo.png" style="height:45px;border-radius:6px"><b style="font-size:11px">DATA.COM<br><span style="background:#ff6b00;color:#000;padding:2px 6px;border-radius:4px;font-size:8px">ECG MANAGER</span></b></div><h2 style="margin-top:14px">ECG <span style="color:#FFD700">Login</span></h2><div class="field"><input type="email" id="e" value="ecg@kratisdata.com"></div><div class="field"><input type="password" id="p" placeholder="ECG2025!"></div><button class="btn" onclick="login()">Login to ECG Dashboard</button><p id="err" style="color:#ff6b6b;font-size:11px;margin-top:10px;display:none"></p><p style="font-size:10px;color:#555;margin-top:12px;text-align:center">ecg@kratisdata.com / ECG2025!</p></div></div>
<div id="dash"><h2>💡 ECG & Prepaid Manager — ONLY ECG</h2><p style="font-size:11px;color:#888">Logged as: <span id="who" style="color:#FFD700"></span></p><div class="card"><h4>🇬🇭 Ghana ECG Prepaid (NO API - Manual)</h4><p style="font-size:12px;margin-top:8px">Meter: 54XXXXXX | GHS 100<br><br><button style="background:#FFD700;color:#000;border:none;padding:8px 14px;border-radius:8px;font-weight:800">Send Token + Upload Receipt Image</button></p></div><div class="card"><h4>🌍 Other Countries Prepaid (API)</h4><p style="font-size:12px">Nigeria Prepaid • API Status: OK</p></div><a href="admin-login.html" style="color:#FFD700;font-size:12px;display:block;margin-top:14px">← Logout</a></div>
<script>function showDash(){document.getElementById('loginOverlay').style.display='none';document.getElementById('dash').style.display='block';document.getElementById('who').innerText=localStorage.getItem('kratis_role')||'ecg@kratisdata.com';}function login(){const e=document.getElementById('e').value.trim().toLowerCase();const p=document.getElementById('p').value.trim();if(e==='ecg@kratisdata.com'&&p==='ECG2025!'){localStorage.setItem('kratis_role',e);showDash();}else{document.getElementById('err').style.display='block';document.getElementById('err').innerText='❌ Wrong! Must be ecg@kratisdata.com / ECG2025!';}}window.onload=function(){if(localStorage.getItem('kratis_role')==='ecg@kratisdata.com'){showDash();}}</script></body></html>
