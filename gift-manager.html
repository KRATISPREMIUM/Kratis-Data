<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gift Cards Manager - Kratis</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
body{background:#0a0a0f;color:#fff;font-family:Arial;margin:0;padding:15px;box-sizing:border-box}
*{box-sizing:border-box}
h2{font-size:18px;margin:6px 0}
.card{background:#16161f;padding:15px;border-radius:12px;border:1px solid #222;margin:10px 0}
button{background:#FFD700;border:none;padding:10px 12px;border-radius:8px;font-weight:bold;cursor:pointer;margin:3px;font-size:13px}
.red{background:#c00;color:#fff}
.green{background:#0a0;color:#fff}
select,input,textarea{width:100%;padding:11px;margin:5px 0;border-radius:8px;background:#222;color:#fff;border:1px solid #444;font-size:16px}
#list{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #222;border-radius:12px;margin-top:10px}
table{width:100%;min-width:760px;font-size:12px;border-collapse:collapse}
td,th{border:1px solid #333;padding:8px;vertical-align:top;word-break:break-word}
th{background:#16161f}
td input{min-width:170px}
@media(max-width:900px){
  body{padding:12px}
  h2{font-size:16px}
  .card{padding:12px}
  button{padding:12px;font-size:14px}
  td button{width:100%;margin:5px 0;padding:11px}
  table{font-size:11px}
  td,th{padding:7px 6px}
}
</style>
</head><body>
<h2>🎁 Gift Cards Manager</h2>
<p id="who" style="color:#FFD700"></p>
<button onclick="contactCEO()">💬 Contact CEO</button>
<button onclick="contactComplaint()">🚨 Contact Complaint Manager</button>
<button onclick="logout()" style="background:#c00;color:#fff">Logout</button>
<hr>
<div class="card">
<h3>Gift Cards Orders</h3>
<select onchange="render(this.value)"><option value="ALL">All</option><option value="USER">Users Only</option><option value="AGENT">Agents Only</option><option value="DEALER">Dealers Only</option></select>
<div id="list"></div>
</div>
<script>
if(localStorage.getItem('manager_role')!=='gift_manager'){ alert('Access Denied - Gift Manager Only'); location.href='admin-login.html'; }
document.getElementById('who').innerText='Logged in: '+localStorage.getItem('manager_name')+' ('+localStorage.getItem('manager_email')+')';

function O(){return JSON.parse(localStorage.getItem('kratis_orders')||'[]')}
function saveO(all){ localStorage.setItem('kratis_orders',JSON.stringify(all)); }
function isGift(o){ let s=((o.cat||'')+' '+(o.name||'')+' '+(o.hist||'')).toUpperCase(); return s.includes('GIFT'); }

function render(filter){
  let orders=O().filter(isGift);
  if(filter!=='ALL') orders=orders.filter(o=>(o.tier||o.role||'USER')===filter);
  if(!orders.length){ document.getElementById('list').innerHTML='<p style="color:#777">No Gift Card orders</p>'; return; }
  let html='<table><tr><th>Order ID</th><th>KDP</th><th>Name/Email/Date</th><th>Card Type / Amount</th><th>Status</th><th>Submit Card Code + Action</th></tr>';
  orders.forEach(o=>{
    html+=`<tr>
    <td><b>${o.id}</b></td>
    <td>${o.kdp||''}</td>
    <td>${o.name||''}<br>${o.email||''}<br><small>${new Date(o.date||Date.now()).toLocaleString()}</small></td>
    <td>${o.name||o.product||'Gift Card'}<br><b>${o.size||o.amount||o.price||''}</b><br>${o.recipient||''}</td>
    <td>${o.status||'Pending'}<br><small>${o.code?'Code: '+o.code:''}</small></td>
    <td>
      <input id="code-${o.id}" placeholder="Type Gift Card Code / PIN">
      <input id="img-${o.id}" placeholder="Receipt / Card Image URL (optional)">
      <button class="green" onclick="submitCode('${o.id}')">✅ Submit Code</button><br>
      <button onclick="checkReceipt('${o.id}')">🧾 Check Receipt</button>
      <button class="red" onclick="fail('${o.id}')">❌ API Fail - Buy Manual Reloadly</button>
    </td></tr>`;
  });
  document.getElementById('list').innerHTML=html+'</table>';
}

function submitCode(id){
  let code=document.getElementById('code-'+id).value.trim();
  let img=document.getElementById('img-'+id).value.trim();
  if(!code){ alert('Type card code first'); return; }
  let all=O(); let o=all.find(x=>x.id===id);
  o.status='Delivered'; o.code=code; o.receipt=img; o.delivered='Gift Card Code: '+code;
  saveO(all);
  try{ db.collection('kratis_orders').doc(id).set(o,{merge:true}); }catch(e){}
  let hist=JSON.parse(localStorage.getItem('kratis_history_'+o.email)||'[]');
  hist.push({msg:'🎁 Gift Card Delivered: '+code, orderId:id, date:new Date().toISOString(), receipt:img});
  localStorage.setItem('kratis_history_'+o.email, JSON.stringify(hist));
  alert('✅ Code sent to user: '+id);
  render('ALL');
}
function checkReceipt(id){
  let o=O().find(x=>x.id===id);
  if(o.receipt){ window.open(o.receipt,'_blank'); } else { alert('No receipt. Code: '+(o.code||'none')); }
}
function fail(id){ let all=O(); let o=all.find(x=>x.id===id); o.status='Manual - Reloadly'; saveO(all); alert('Marked for manual Reloadly purchase: '+id); render('ALL'); }

function contactCEO(){ let m=prompt('Message for CEO:'); if(m){ localStorage.setItem('kratis_mgr_msg','Gift Manager ('+localStorage.getItem('manager_email')+'): '+m); alert('Saved for CEO'); } }
function contactComplaint(){ let m=prompt('Message for Complaint Manager:'); if(m){ localStorage.setItem('kratis_to_complaint',m); alert('Sent'); } }
function logout(){ localStorage.removeItem('manager_email'); localStorage.removeItem('manager_role'); location.href='admin-login.html'; }

render('ALL');
</script></body></html>
