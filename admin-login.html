<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Login - Kratis</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#050505;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;position:relative;padding:20px}
.gear{position:absolute;font-size:110px;opacity:.15;animation:float 12s ease-in-out infinite;filter:sepia(1) saturate(4) hue-rotate(5deg);pointer-events:none;z-index:1}
.g1{top:6%;left:3%}.g2{top:12%;right:5%;font-size:85px;animation-delay:2s}.g3{bottom:8%;left:6%;font-size:75px;animation-delay:4s}.g4{bottom:12%;right:3%;font-size:130px;animation-delay:1s}.g5{top:45%;left:1%;font-size:55px;animation-delay:3s}.g6{top:48%;right:1%;font-size:65px;animation-delay:5s}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-35px) rotate(180deg)}}
.fire-text{text-align:center;font-size:clamp(26px,6vw,54px);font-weight:900;letter-spacing:2px;line-height:1.15;margin-bottom:26px;background:linear-gradient(180deg,#fff7ae 0%,#ffd700 35%,#ff8c00 70%,#ff4500 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:flicker 2s infinite alternate;z-index:2}
@keyframes flicker{from{filter:brightness(1)}to{filter:brightness(1.3)}}
.box{background:rgba(18,18,18,.85);backdrop-filter:blur(12px);padding:30px;border-radius:20px;width:90%;max-width:400px;border:1px solid rgba(255,215,0,.3);box-shadow:0 0 45px rgba(255,140,0,.2);z-index:2}
input{width:100%;padding:14px;margin:10px 0;border-radius:10px;background:#09090b;border:1px solid #222;color:#fff;outline:none}
input:focus{border-color:#FFD700}
button{width:100%;padding:14px;background:#FFD700;border:none;border-radius:10px;font-weight:900;cursor:pointer;color:#000}
button:hover{box-shadow:0 8px 25px rgba(255,215,0,.4)}
h2 span{color:#FFD700}
</style>
</head><body>
<div class="gear g1">⚙️</div><div class="gear g2">⚙️</div><div class="gear g3">⚙️</div><div class="gear g4">⚙️</div><div class="gear g5">⚙️</div><div class="gear g6">⚙️</div>
<div class="fire-text">YOUR IDEAL SUCCESS<br>IS OUR GOAL</div>
<div class="box">
<h2>Manager <span>Access</span></h2>
<p style="color:#777;font-size:12px">Login with your assigned Email & Password</p>
<input id="email" type="email" placeholder="your@kratisdata.com">
<input id="pass" type="password" placeholder="••••••••">
<div id="err" style="color:#ff6b6b;font-size:12px;display:none;margin:10px 0"></div>
<button onclick="login()">Secure Login → Continue</button>
<p style="color:#444;font-size:10px;text-align:center;margin-top:15px">Confidential - Authorized Personnel Only</p>
</div>
<script>
const ROLE_PAGE = {
  complaint_manager: "complaint-manager.html",
  transaction_manager: "transaction-manager.html",
  ecg_manager: "ecg-manager.html",
  afa_manager: "afa-manager.html",
  data_manager: "data-manager.html",
  gift_manager: "gift-manager.html"
};
async function login(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  const err=document.getElementById('err');
  err.style.display='block'; err.style.color='#FFD700'; err.innerText='Checking...';
  try{
    const doc=await db.collection('kratis_users').doc(email).get();
    if(!doc.exists){ err.style.color='#ff6b6b'; err.innerText='❌ Account no dey. Contact CEO.'; return; }
    const u=doc.data();
    // For now, password check for demo - later we go use Firebase Auth
    if(u.pass && u.pass!==pass){ err.style.color='#ff6b6b'; err.innerText='❌ Wrong password'; return; }
    const role=u.role||u.tier||'';
    if(!ROLE_PAGE[role]){ err.style.color='#ff6b6b'; err.innerText='❌ You no be Manager. Role: '+role; return; }
    localStorage.setItem('manager_email',email);
    localStorage.setItem('manager_role',role);
    localStorage.setItem('manager_name',u.name||role);
    localStorage.setItem('kratis_logged_user',email);
    localStorage.setItem('kratis_logged','yes');
    window.location.href=ROLE_PAGE[role];
  }catch(e){ err.style.color='#ff6b6b'; err.innerText='❌ '+e.message; }
}
</script></body></html>
