<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manager Login - Kratis</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden;background:#050505 url('gears-bg.jpeg') center/cover no-repeat fixed}
body::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 0%,rgba(0,0,0,.55) 100%);z-index:0}
.fire-text{text-align:center;font-size:clamp(28px,6vw,56px);font-weight:900;letter-spacing:2px;line-height:1.15;margin-bottom:26px;background:linear-gradient(180deg,#fff7ae 0%,#ffd700 35%,#ff8c00 70%,#ff4500 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 18px rgba(255,140,0,.8));animation:flicker 1.8s infinite alternate;z-index:2}
@keyframes flicker{from{filter:drop-shadow(0 0 12px rgba(255,140,0,.6)) brightness(1)}to{filter:drop-shadow(0 0 28px rgba(255,140,0,.95)) brightness(1.25)}}
.box{background:rgba(25,25,25,.62);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:34px 30px;border-radius:22px;width:92%;max-width:430px;border:1px solid rgba(255,215,0,.35);box-shadow:0 0 60px rgba(255,140,0,.25),inset 0 1px 0 rgba(255,255,255,.12);z-index:2}
.box h2{text-align:center;font-size:28px;margin-bottom:8px}
.box h2 span{color:#FFD700}
.sub{text-align:center;color:#bbb;font-size:13px;margin-bottom:24px}
label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px;color:#eee}
input{width:100%;padding:14px 16px;border-radius:10px;background:rgba(0,0,0,.55);border:1px solid rgba(255,215,0,.25);color:#fff;outline:none;font-size:14px}
input:focus{border-color:#FFD700;box-shadow:0 0 0 3px rgba(255,215,0,.15)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#aaa;margin:14px 0 18px}
.row a{color:#FFD700;text-decoration:none;font-weight:700}
button{width:100%;padding:15px;background:linear-gradient(90deg,#FFD700,#FFB300);border:none;border-radius:12px;font-weight:900;font-size:16px;cursor:pointer;color:#000;transition:.2s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(255,215,0,.45)}
.foot{text-align:center;color:#999;font-size:11px;margin-top:18px}
.footer{margin-top:22px;color:#c9a86a;font-size:12px;z-index:2;text-align:center}
</style>
</head><body>
<div class="fire-text">YOUR IDEAL SUCCESS<br>IS OUR GOAL</div>
<div class="box">
<h2>Manager <span>Access</span></h2>
<p class="sub">Sign in to your manager dashboard</p>
<label>Email Address</label>
<input id="email" type="email" placeholder="manager@company.gh">
<label>Password</label>
<input id="pass" type="password" placeholder="••••••••••">
<div id="err" style="color:#ff6b6b;font-size:12px;display:none;margin:10px 0"></div>
<div class="row"><span>☐ Remember me</span><a href="#" onclick="return false">Forgot password?</a></div>
<button onclick="login()">Secure Login</button>
<p class="foot">Secured with 256-bit encryption • Trusted by Ghana Startups 🇬🇭</p>
</div>
<p class="footer">© 2026 • Accra, Ghana • Kratis Premium • Privacy • Terms</p>
<p style="color:#444;font-size:10px;text-align:center;margin-top:15px">Confidential - Authorized Personnel Only</p>
</div>
<script>
const ROLE_PAGE = {
  complaint_manager: "complaint-manager.html",
  transaction_manager: "transaction-manager.html",
  ecg_manager: "ecg-manager.html",
  afa_manager: "afa-manager.html",
  data_manager: "data-manager.html",
  gift_manager: "gift-manager.html"
};
async function login(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const pass=document.getElementById('pass').value.trim();
  const err=document.getElementById('err');
  err.style.display='block'; err.style.color='#FFD700'; err.innerText='Checking...';
  try{
    const doc=await db.collection('kratis_users').doc(email).get();
    if(!doc.exists){ err.style.color='#ff6b6b'; err.innerText='❌ Account no dey. Contact CEO.'; return; }
    const u=doc.data();
    // For now, password check for demo - later we go use Firebase Auth
    if(u.pass && u.pass!==pass){ err.style.color='#ff6b6b'; err.innerText='❌ Wrong password'; return; }
    const role=u.role||u.tier||'';
    if(!ROLE_PAGE[role]){ err.style.color='#ff6b6b'; err.innerText='❌ You no be Manager. Role: '+role; return; }
    localStorage.setItem('manager_email',email);
    localStorage.setItem('manager_role',role);
    localStorage.setItem('manager_name',u.name||role);
    localStorage.setItem('kratis_logged_user',email);
    localStorage.setItem('kratis_logged','yes');
    window.location.href=ROLE_PAGE[role];
  }catch(e){ err.style.color='#ff6b6b'; err.innerText='❌ '+e.message; }
}
</script></body></html>
