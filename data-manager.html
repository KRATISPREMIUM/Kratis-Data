<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Data Manager - KRATIS DATA</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;padding:20px}
h1{color:#FFD400}
.card{background:#111;border:1px solid #333;padding:15px;margin:10px 0;border-radius:10px}
button{background:#FFD400;color:#000;padding:10px 15px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.green{background:#00E676}
</style>
</head>
<body>
<h1>DATA MANAGER</h1>
<p>Ghana GB + International Bundle & Airtime</p>
<p id="info"></p>
<button onclick="loadOrders()">LOAD ORDERS</button>
<button onclick="logout()" style="background:#ff5252">Logout</button>
<div id="orders"></div>

<script>
const role = localStorage.getItem('manager_role');
if(role !== 'data_manager' && role !== 'manager' && role !== 'data' && role !== 'ceo'){
  alert('No Data Manager Access');
  window.location.href='admin-login.html';
}
document.getElementById('info').textContent = 'Logged in: ' + localStorage.getItem('manager_email');

async function loadOrders(){
  const box = document.getElementById('orders');
  box.innerHTML = 'Loading...';
  try{
    const snap = await db.collection('kratis_orders').get();
    let list = [];
    snap.forEach(d=> list.push({docId:d.id, ...d.data()}));
    // filter only Data: Ghana GB + International
   // show all orders
    if(!list.length){ box.innerHTML='<p>No Data orders yet</p>'; return; }
    box.innerHTML = '';
    list.sort((a,b)=> new Date(b.date||0)-new Date(a.date||0));
    list.forEach(o=>{
      const div = document.createElement('div');
      div.className='card';
      div.innerHTML = `<b>${o.id}</b> | ${o.name||o.product||''} | ${o.recipient||o.to||o.phone||''} | GH₵${o.amount||o.amt||0}<br>Status: <b>${o.status||'Pending'}</b> | ${o.date||''}<br><br>
      <button onclick="setStatus('${o.docId}','Processing')">Processing</button>
     <button class="green" onclick="setStatus('${o.docId}','Delivered')">Delivered</button>
<button onclick="confirmManual('${o.docId}','${o.id}')">Place Manually & Confirm</button>`;
      box.appendChild(div);
    });
  }catch(e){ box.innerHTML='Fail: '+e.message; }
}

async function setStatus(docId, status){
  try{
    await db.collection('kratis_orders').doc(docId).update({status: status});
    await db.collection('orders').doc(docId).set({status: status}, {merge:true});
    alert('Updated to '+status);
    loadOrders();
  }catch(e){ alert('Fail: '+e.message); }
}

async function confirmManual(docId, orderId){
  if(!confirm('Place '+orderId+' manually and Confirm Delivered?')) return;
  try{
    await db.collection('kratis_orders').doc(docId).update({status:'Delivered'});
    const q = await db.collection('orders').where('id','==',orderId).get();
    if(!q.empty){ q.forEach(d=> d.ref.update({status:'Delivered'})); }
    else { await db.collection('orders').doc(orderId).set({status:'Delivered'}, {merge:true}); }
    alert('Updated to Delivered');
    loadOrders();
  }catch(e){ alert('Fail: '+e.message); }
}

function logout(){
  localStorage.removeItem('manager_email');
  localStorage.removeItem('manager_role');
  window.location.href='admin-login.html';
}

// auto load
loadOrders();
db.collection('kratis_orders').onSnapshot(()=> loadOrders());
</script>
</body>
</html>
