<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Manager - Kratis</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase.js"></script>
<style>
body{background:#0a0a0f;color:#fff;font-family:Arial;margin:0;padding:15px;box-sizing:border-box}
*{box-sizing:border-box}
h2{font-size:18px;margin:6px 0}
.card{background:#16161f;padding:15px;border-radius:12px;border:1px solid #222;margin:10px 0}
button{background:#FFD700;border:none;padding:10px 12px;border-radius:8px;font-weight:bold;cursor:pointer;font-size:13px;margin:4px 4px 4px 0}
select,input,textarea{width:100%;padding:11px;margin:5px 0;border-radius:8px;background:#222;color:#fff;border:1px solid #444;font-size:16px}
#list{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid #222;border-radius:12px;margin-top:10px}
table{width:100%;min-width:720px;font-size:12px;border-collapse:collapse}
td,th{border:1px solid #333;padding:8px;word-break:break-word}
th{background:#16161f;position:sticky;top:0}
@media(max-width:900px){
  body{padding:12px}
  h2{font-size:16px}
  button{width:100%;padding:12px;font-size:14px;margin:5px 0}
  td button{width:auto;padding:8px 10px;font-size:11px}
  table{font-size:11px}
  td,th{padding:7px 6px}
}
</style>
</head><body>
<h2>📊 Data Manager - Ghana GB</h2>
<p id="who" style="color:#FFD700"></p>
<button onclick="contactCEO()">💬 Contact CEO</button>
<button onclick="contactComplaint()">🚨 Contact Complaint Manager</button>
<hr>
<select onchange="render(this.value)"><option value="ALL">All Orders</option><option value="USER">Users Only</option><option value="AGENT">Agents Only</option><option value="DEALER">Dealers Only</option></select>
<div id="list"></div>
<script>
if(localStorage.getItem('manager_role')!=='data_manager'){ alert('Access Denied'); location.href='admin-login.html'; }
document.getElementById('who').innerText='Logged in: '+localStorage.getItem('manager_name')+' ('+localStorage.getItem('manager_email')+')';
function O(){return JSON.parse(localStorage.getItem('kratis_orders')||'[]')}
function render(filter){
  let orders=O().filter(o=> (o.cat||o.name||'').toUpperCase().includes('GHANA') || (o.hist||'').toUpperCase().includes('GB'));
  if(filter!=='ALL') orders=orders.filter(o=>(o.tier||o.role||'USER')===filter);
  let html='<table><tr><th>Order ID</th><th>KDP</th><th>Name/Email</th><th>Network/GB</th><th>Recipient</th><th>Amount</th><th>Status</th><th>Action</th></tr>';
  orders.forEach(o=>{
    html+=`<tr><td><b>${o.id}</b></td><td>${o.kdp||''}</td><td>${o.name||''}<br>${o.email||''}</td><td>${o.network||o.net||''} ${o.size||o.gb||''}</td><td>${o.recipient||o.phone||''}</td><td>GH₵${o.amount||o.price||''}</td><td>${o.status}</td>
    <td><button onclick="done('${o.id}')">✅ Mark Delivered</button><br><button onclick="fail('${o.id}')">❌ API Fail - Buy Manual DIGI-Mall</button></td></tr>`;
  });
  document.getElementById('list').innerHTML=html+'</table>';
}
function done(id){ let all=O(); let o=all.find(x=>x.id===id); o.status='Delivered'; localStorage.setItem('kratis_orders',JSON.stringify(all)); try{db.collection('kratis_orders').doc(id).set(o,{merge:true})}catch(e){} alert('Delivered: '+id); render('ALL'); }
function fail(id){ let all=O(); let o=all.find(x=>x.id===id); o.status='Manual - DIGI-Mall'; localStorage.setItem('kratis_orders',JSON.stringify(all)); alert('Marked for manual DIGI-Mall purchase: '+id); render('ALL'); }
function contactCEO(){ localStorage.setItem('kratis_mgr_msg','Data Manager needs CEO: '+localStorage.getItem('manager_email')); alert('Message saved for CEO. CEO go see am for Broadcast page.'); }
function contactComplaint(){ let msg=prompt('Message for Complaint Manager:'); if(msg){ localStorage.setItem('kratis_to_complaint',msg); alert('Sent to Complaint Manager'); } }
render('ALL');
</script></body></html>
