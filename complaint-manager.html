<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Manager - SwiftMart</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0;padding:20px}
h2{color:#1a237e}
.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:10px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.badge{background:#ff5722;color:#fff;padding:2px 8px;border-radius:12px;font-size:12px}
.badge.done{background:#4caf50}
textarea{width:100%;padding:8px;margin:8px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#1a237e;color:#fff;border:none;padding:9px 14px;border-radius:6px;cursor:pointer;margin-right:6px}
button.red{background:#d32f2f}
button.green{background:#388e3c}
.reply{background:#e8eaf6;padding:10px;border-radius:6px;margin-top:10px}
select{padding:9px;border-radius:6px;border:1px solid #ccc}
</style>
</head>
<body>

<h2>Complaint Manager</h2>

<div class="card">
  <h3>Message All Managers</h3>
  <textarea id="broadcastMsg" rows="2" placeholder="Type message to all managers..."></textarea>
  <button onclick="sendBroadcast()">Send to All Managers</button>
</div>

<div class="card">
  <b>Filter:</b>
  <select id="filter" onchange="render()">
    <option value="All">All Complaints</option>
    <option value="Pending">Pending</option>
    <option value="Replied">Replied</option>
    <option value="Resolved">Resolved</option>
  </select>
  <span id="count"></span>
</div>

<div id="complaintList"></div>

<script>
// Load from localStorage so complaint.html and this page share data
function getComplaints(){
  return JSON.parse(localStorage.getItem('swiftmart_complaints') || '[]');
}
function saveComplaints(data){
  localStorage.setItem('swiftmart_complaints', JSON.stringify(data));
}

function render(){
  let complaints = getComplaints();
  let filter = document.getElementById('filter').value;
  let filtered = filter === 'All' ? complaints : complaints.filter(c=>c.status===filter);
  
  document.getElementById('count').innerText = ` - ${filtered.length} complaint(s)`;

  let list = document.getElementById('complaintList');
  if(filtered.length === 0){
    list.innerHTML = '<div class="card">No complaints found.</div>';
    return;
  }

  list.innerHTML = filtered.map(c=>`
    <div class="card">
      <b>${c.user}</b> 
      <span class="badge ${c.status==='Resolved'?'done':''}">${c.status}</span>
      <small style="float:right">${c.date || ''}</small>
      <p>${c.text}</p>
      ${c.reply ? `<div class="reply"><b>Your Reply:</b> ${c.reply}</div>` : ''}
      
      <textarea id="reply-${c.id}" rows="2" placeholder="Write reply to user..."></textarea>
      <button onclick="replyTo(${c.id})">Reply User</button>
      <button class="green" onclick="markResolved(${c.id})">Mark Resolved</button>
      <button class="red" onclick="delComplaint(${c.id})">Delete</button>
    </div>
  `).join('');
}

function replyTo(id){
  let val = document.getElementById('reply-'+id).value.trim();
  if(!val) return alert('Write a reply first');
  let complaints = getComplaints();
  let c = complaints.find(x=>x.id===id);
  c.reply = val;
  c.status = "Replied";
  saveComplaints(complaints);
  alert('Reply sent to user!');
  render();
}

function markResolved(id){
  let complaints = getComplaints();
  let c = complaints.find(x=>x.id===id);
  c.status = "Resolved";
  saveComplaints(complaints);
  render();
}

function delComplaint(id){
  if(!confirm('Delete this complaint?')) return;
  let complaints = getComplaints().filter(x=>x.id!==id);
  saveComplaints(complaints);
  render();
}

function sendBroadcast(){
  let msg = document.getElementById('broadcastMsg').value.trim();
  if(!msg) return alert('Type a message');
  localStorage.setItem('manager_broadcast', msg);
  alert('Message sent to all managers!');
  document.getElementById('broadcastMsg').value='';
}

render();
</script>
</body>
</html>
