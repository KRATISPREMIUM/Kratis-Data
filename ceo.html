<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KRATIS CEO - CLEAN 2026 - 0 Reads Crash</title>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
<style>body{background:#0a0a0a;color:#fff;font-family:Arial;padding:20px;font-size:12px}.card{background:#151515;border:1px solid #333;padding:15px;border-radius:8px;margin:10px 0}.btn{background:#FFD700;color:#000;padding:10px 20px;border:none;border-radius:6px;font-weight:900;cursor:pointer;margin:5px}.green{color:#00ff88}.yellow{color:#FFD700}</style>
</head>
<body>
<h2 class="yellow">KRATIS CEO - CLEAN 2026 - 0 READS PROJECT</h2>
<div class="card">
<div>Project: <span class="green">kratis-premium-clean-2026 - 0 reads</span></div>
<div>Status: <span id="status">Connecting...</span></div>
<div>Total Users: <span id="total" class="yellow">0</span> REAL ONLY</div>
<div>Last Sync: <span id="lastSync">--:--</span></div>
</div>
<div class="card">
<button class="btn" onclick="loadUsers()">LOAD 10 USERS ONLY (10 reads)</button>
<button class="btn" style="background:#222;color:#FFD700;border:1px solid #FFD700" onclick="approveAgent()">APPROVE AGENT (PERMANENT)</button>
<div style="margin-top:10px">
<input id="agentEmail" placeholder="Enter agent email to approve" style="padding:8px;width:250px;border-radius:4px;border:1px solid #333;background:#000;color:#fff">
</div>
</div>
<div class="card" id="userList">No users yet - Register first on index.html</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyA56gWuoPIoxVo7rXyS1yIpfkV6RkdIQVQ",
  authDomain: "kratis-premium-clean-2026.firebaseapp.com",
  projectId: "kratis-premium-clean-2026",
  storageBucket: "kratis-premium-clean-2026.firebasestorage.app",
  messagingSenderId: "845995627106",
  appId: "1:845995627106:web:1cd2e6511233d3365b773b"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function loadUsers(){
 document.getElementById('status').innerText = "Loading 10 only... (10 reads)";
 try{
   const snap = await db.collection('users').limit(10).get();
   let html = "";
   let count = 0;
   snap.forEach(doc=>{
     count++;
     let d = doc.data();
     html += `<div style="padding:8px;border-bottom:1px solid #222;display:flex;justify-content:space-between"><span>${doc.id} - role: ${d.role||'user'} - approved: ${d.approved||false}</span> <button class="btn" style="padding:2px 8px;font-size:10px" onclick="makeAgent('${doc.id}')">Make AGENT</button></div>`;
   });
   document.getElementById('total').innerText = count;
   document.getElementById('userList').innerHTML = html || "No users - 0 reads used - Register on index.html";
   document.getElementById('status').innerText = "Live - "+count+" users - 10 reads only - No crash!";
   document.getElementById('lastSync').innerText = new Date().toLocaleTimeString();
 }catch(e){ document.getElementById('status').innerText = "Error: "+e.message; }
}

async function makeAgent(email){
 if(!confirm("Make "+email+" AGENT permanently?")) return;
 await db.collection('users').doc(email).update({role:"agent",approved:true,status:"approved",isAgent:true,type:"AGENT"});
 alert("✅ "+email+" is now AGENT forever! Tell him logout/login on index.html");
 loadUsers();
}

async function approveAgent(){
 let email = document.getElementById('agentEmail').value;
 if(!email){ alert("Enter email"); return; }
 await db.collection('users').doc(email).set({role:"agent",approved:true,status:"approved",isAgent:true,type:"AGENT",email:email}, {merge:true});
 alert("✅ "+email+" AGENT approved permanently in CLEAN project!");
 loadUsers();
}

window.onload = loadUsers;
</script>
</body>
</html>
